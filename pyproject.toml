[project]
name = "agent"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    "python-dotenv",
    "uvicorn",
    "pipecat-ai[silero,websocket,openai]>=0.0.102",
]

[dependency-groups]
dev = [
    "httpx>=0.27,<1",
    "pytest>=8,<9",
]

[tool.pyright]
venvPath = "."
venv = ".venv"
pythonVersion = "3.11"

[tool.pytest.ini_options]
pythonpath = ["."]
markers = [
    "eval: opt-in tests that call a tutor model and an LLM judge",
]
